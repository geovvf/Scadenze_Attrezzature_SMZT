<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Nucleo Sommozzatori - Login</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #f0f4f8; color: #1e293b; padding: 1rem; }
    .container { max-width: 900px; margin: auto; background: white; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 1.8rem; }
    h1, h2 { text-align: center; }
    .login-box { max-width: 400px; margin: 4rem auto; }
    .login-box input { width: 100%; padding: 0.8rem; margin: 0.5rem 0; border: 1px solid #cbd5e1; border-radius: 8px; }
    .btn { padding: 0.6rem 1rem; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.2s; }
    .btn-dark { background: #0f172a; color: white; } .btn-dark:hover { background: #334155; }
    .btn-danger { background: #ef4444; color: white; } .btn-danger:hover { background: #dc2626; }
    .btn-outline { background: white; border: 1px solid #0f172a; color: #0f172a; }
    .btn-green { background: #16a34a; color: white; } .btn-green:hover { background: #15803d; }
    .tabs { display: flex; gap: 0.3rem; margin-bottom: 1.5rem; border-bottom: 2px solid #e2e8f0; }
    .tab { padding: 0.7rem 1.2rem; background: none; border: none; font-weight: 600; color: #64748b; border-radius: 10px 10px 0 0; cursor: pointer; }
    .tab.active { background: white; color: #0f172a; border: 1px solid #e2e8f0; border-bottom: 2px solid white; margin-bottom: -2px; }
    .card { background: #f8fafc; border-radius: 12px; margin-bottom: 1rem; border: 1px solid #e2e8f0; }
    .person-header { display: flex; align-items: center; justify-content: space-between; padding: 1rem; cursor: pointer; }
    .person-header:hover { background: #f1f5f9; }
    .folder-icon { transition: transform 0.2s; }
    .folder-icon.open { transform: rotate(90deg); }
    .badge { background: #e2e8f0; padding: 0.2rem 0.6rem; border-radius: 12px; font-size: 0.8rem; }
    .badge.warning { background: #fef3c7; color: #b45309; }
    .badge.danger { background: #fee2e2; color: #991b1b; }
    .attrezzatura-row { display: flex; align-items: center; justify-content: space-between; background: white; border-radius: 8px; padding: 0.7rem; margin: 0.5rem 0; border: 1px solid #e2e8f0; }
    .circle { width: 16px; height: 16px; border-radius: 50%; display: inline-block; }
    .green { background: #22c55e; } .yellow { background: #eab308; } .red { background: #ef4444; }
    .hidden { display: none; }
    .user-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
    .utente-row { display: flex; justify-content: space-between; align-items: center; padding: 0.8rem; border-bottom: 1px solid #e2e8f0; }
    @media (max-width: 500px) { .attrezzatura-row { flex-direction: column; align-items: flex-start; } }
  </style>
</head>
<body>
<div id="loginScreen" class="container login-box">
  <h1>🧑‍🚒 Nucleo Sommozzatori</h1>
  <p id="loginMessage">Accedi con le tue credenziali</p>
  <input type="text" id="loginUsername" placeholder="Username (es. pippo.franco)">
  <input type="password" id="loginPassword" placeholder="Password">
  <button class="btn btn-dark" id="loginBtn" style="width:100%">Accedi</button>
  <div id="firstAccessForm" class="hidden" style="margin-top:1rem;">
    <p><strong>Primo accesso: imposta la tua password</strong></p>
    <input type="password" id="newPassword" placeholder="Nuova password">
    <input type="password" id="confirmPassword" placeholder="Conferma password">
    <button class="btn btn-dark" id="setPasswordBtn" style="width:100%">Imposta Password e Accedi</button>
  </div>
</div>

<div id="appScreen" class="container hidden">
  <div class="user-bar">
    <strong id="welcomeMsg"></strong>
    <button class="btn btn-outline" id="logoutBtn">Esci</button>
  </div>
  <div class="tabs" id="tabsContainer">
    <div class="tab active" data-tab="gestione">👥 Gestione</div>
    <div class="tab" data-tab="dashboard">📊 Dashboard</div>
    <div class="tab admin-only hidden" data-tab="utenti">👤 Utenti</div>
  </div>
  <div id="tabGestione">
    <div id="adminAddPersonForm" class="card hidden" style="padding:1rem;">
      <strong>➕ Aggiungi Persona</strong>
      <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:0.5rem;">
        <input type="text" id="newNome" placeholder="Nome" required>
        <input type="text" id="newCognome" placeholder="Cognome" required>
        <input type="text" id="newUsername" placeholder="Username" required>
        <button class="btn btn-dark btn-sm" id="addPersonBtn">Aggiungi</button>
      </div>
    </div>
    <div id="listaPersone"></div>
  </div>
  <div id="tabDashboard" class="hidden">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap;">
      <h2>⚠️ Attrezzature in attenzione</h2>
      <div>
        <button id="exportCsvBtn" class="btn btn-green btn-sm">📥 Esporta CSV</button>
        <button id="checkNotificheBtn" class="btn btn-dark btn-sm" style="margin-left:0.5rem;">🔔 Invia notifica riepilogo</button>
      </div>
    </div>
    <div id="dashboardContent"></div>
  </div>
  <div id="tabUtenti" class="hidden">
    <h2>👤 Gestione Utenti</h2>
    <div id="utentiContent"></div>
  </div>
</div>

<script>
  (function() {
    const STORAGE = 'nucleo_db_auth_v3';
    let db = JSON.parse(localStorage.getItem(STORAGE)) || {};

    if (!db.utenti) {
      db = {
        utenti: [
          { id: 'admin', nome: 'Amministratore', cognome: '', username: 'admin', password: 'admin', ruolo: 'admin' }
        ],
        attrezzature: []
      };
    } else {
      if (!db.utenti.find(u => u.id === 'admin')) {
        db.utenti.push({ id: 'admin', nome: 'Amministratore', cognome: '', username: 'admin', password: 'admin', ruolo: 'admin' });
      }
    }
    db.attrezzature.forEach(a => { if(!a.id) a.id = 'a_'+Date.now()+Math.random(); });

    let currentUser = JSON.parse(sessionStorage.getItem('currentUser')) || null;

    function save() {
      localStorage.setItem(STORAGE, JSON.stringify(db));
      updateServiceWorker();
    }

    // Registrazione SW (file esterno sw.js)
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').then(reg => {
        console.log('Service Worker registrato:', reg);
        // Richiedi sincronizzazione periodica se disponibile
        if ('periodicSync' in reg) {
          reg.periodicSync.register('check-attrezzature', {
            minInterval: 24 * 60 * 60 * 1000 // 1 giorno
          }).catch(() => console.log('Periodic Sync non disponibile'));
        }
      }).catch(err => console.error('Errore SW:', err));
      
      // Ascolta messaggi dal SW (es. per riprogrammare)
      navigator.serviceWorker.addEventListener('message', event => {
        if (event.data && event.data.type === 'REQUEST_RESCHEDULE') {
          updateServiceWorker();
        }
      });
    }

    function updateServiceWorker() {
      if (!navigator.serviceWorker?.controller) return;
      if (!currentUser) {
        navigator.serviceWorker.controller.postMessage({ type: 'SCHEDULE_NOTIFICATIONS', attrezzature: [] });
        return;
      }
      let items = [];
      const filterUser = currentUser.ruolo === 'admin' ? null : currentUser.id;
      db.attrezzature.forEach(a => {
        if (filterUser && a.personaId !== filterUser) return;
        const p = db.utenti.find(u => u.id === a.personaId) || {};
        items.push({ id: a.id, scad: a.dataScadenza, persona: (p.nome||'')+' '+(p.cognome||''), tipo: a.tipo, matricola: a.matricola });
      });
      navigator.serviceWorker.controller.postMessage({ type: 'SCHEDULE_NOTIFICATIONS', attrezzature: items });
    }

    // UI Elements
    const loginScreen = document.getElementById('loginScreen');
    const appScreen = document.getElementById('appScreen');
    const welcomeMsg = document.getElementById('welcomeMsg');
    const adminAddPersonForm = document.getElementById('adminAddPersonForm');
    const listaPersone = document.getElementById('listaPersone');
    const dashboardContent = document.getElementById('dashboardContent');
    const utentiContent = document.getElementById('utentiContent');
    const tabs = document.querySelectorAll('.tab');
    const tabGestione = document.getElementById('tabGestione');
    const tabDashboard = document.getElementById('tabDashboard');
    const tabUtenti = document.getElementById('tabUtenti');
    const adminOnlyTabs = document.querySelectorAll('.admin-only');

    const loginUsername = document.getElementById('loginUsername');
    const loginPassword = document.getElementById('loginPassword');
    const loginBtn = document.getElementById('loginBtn');
    const firstAccessForm = document.getElementById('firstAccessForm');
    const newPassword = document.getElementById('newPassword');
    const confirmPassword = document.getElementById('confirmPassword');
    const setPasswordBtn = document.getElementById('setPasswordBtn');
    const loginMessage = document.getElementById('loginMessage');

    let pendingUser = null;

    function showApp() {
      loginScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
      welcomeMsg.textContent = `Benvenuto, ${currentUser.nome} ${currentUser.cognome} (${currentUser.ruolo === 'admin' ? 'Amministratore' : 'Personale'})`;
      adminAddPersonForm.classList.toggle('hidden', currentUser.ruolo !== 'admin');
      adminOnlyTabs.forEach(el => el.classList.toggle('hidden', currentUser.ruolo !== 'admin'));
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      const firstTab = document.querySelector('.tab:not(.hidden)');
      if (firstTab) firstTab.classList.add('active');
      tabGestione.classList.remove('hidden');
      tabDashboard.classList.add('hidden');
      tabUtenti.classList.add('hidden');
      renderGestione();
      updateServiceWorker();
    }

    function showLogin() {
      appScreen.classList.add('hidden');
      loginScreen.classList.remove('hidden');
      firstAccessForm.classList.add('hidden');
      loginPassword.type = 'password';
      loginPassword.placeholder = 'Password';
      loginBtn.classList.remove('hidden');
      loginMessage.textContent = 'Accedi con le tue credenziali';
      pendingUser = null;
      sessionStorage.removeItem('currentUser');
      currentUser = null;
      updateServiceWorker();
    }

    loginBtn.addEventListener('click', () => {
      const username = loginUsername.value.trim();
      const password = loginPassword.value;
      if (!username) return alert('Inserisci username');
      const user = db.utenti.find(u => u.username === username);
      if (!user) return alert('Username non trovato');
      if (!user.password || user.password === '') {
        pendingUser = user;
        firstAccessForm.classList.remove('hidden');
        loginBtn.classList.add('hidden');
        loginPassword.type = 'hidden';
        loginPassword.value = '';
        loginMessage.textContent = `Benvenuto ${user.nome}, imposta la tua password`;
        newPassword.value = '';
        confirmPassword.value = '';
        return;
      }
      if (user.password !== password) return alert('Password errata');
      currentUser = user;
      sessionStorage.setItem('currentUser', JSON.stringify(user));
      showApp();
    });

    setPasswordBtn.addEventListener('click', () => {
      if (!pendingUser) return;
      const pw1 = newPassword.value;
      const pw2 = confirmPassword.value;
      if (!pw1 || pw1.length < 1) return alert('Inserisci una password');
      if (pw1 !== pw2) return alert('Le password non coincidono');
      pendingUser.password = pw1;
      save();
      currentUser = pendingUser;
      sessionStorage.setItem('currentUser', JSON.stringify(currentUser));
      pendingUser = null;
      showApp();
    });

    document.getElementById('logoutBtn').addEventListener('click', showLogin);

    tabs.forEach(t => t.addEventListener('click', function() {
      tabs.forEach(x => x.classList.remove('active'));
      this.classList.add('active');
      const tab = this.dataset.tab;
      tabGestione.classList.add('hidden');
      tabDashboard.classList.add('hidden');
      tabUtenti.classList.add('hidden');
      if (tab === 'gestione') tabGestione.classList.remove('hidden');
      if (tab === 'dashboard') { tabDashboard.classList.remove('hidden'); renderDashboard(); }
      if (tab === 'utenti') { tabUtenti.classList.remove('hidden'); renderUtenti(); }
    }));

    function getStatus(attr) {
      const oggi = new Date(); oggi.setHours(0,0,0,0);
      const scad = attr.dataScadenza ? new Date(attr.dataScadenza + 'T00:00:00') : null;
      const rev = attr.dataRevisione ? new Date(attr.dataRevisione + 'T00:00:00') : null;
      if (scad && scad < oggi) return 'red';
      if (!rev || (oggi - rev) > 365*86400000) return 'red';
      if (scad && Math.ceil((scad - oggi)/86400000) <= 60) return 'yellow';
      return 'green';
    }

    function renderGestione() {
      const personeVisibili = currentUser.ruolo === 'admin' ? db.utenti.filter(u => u.id !== 'admin') : [currentUser];
      if (personeVisibili.length === 0) {
        listaPersone.innerHTML = '<p>Nessuna persona presente.</p>';
        return;
      }
      listaPersone.innerHTML = personeVisibili.map(u => {
        const attrs = db.attrezzature.filter(a => a.personaId === u.id);
        const warningCount = attrs.filter(a => getStatus(a) !== 'green').length;
        return `
          <div class="card">
            <div class="person-header" onclick="this.nextElementSibling.classList.toggle('hidden'); this.querySelector('.folder-icon').classList.toggle('open')">
              <div style="display:flex; align-items:center; gap:0.8rem;">
                <span class="folder-icon">▶</span>
                <strong>${u.nome} ${u.cognome}</strong>
              </div>
              <div style="display:flex; gap:0.5rem; align-items:center;">
                ${warningCount > 0 ? `<span class="badge warning">${warningCount} ⚠️</span>` : ''}
                <span class="badge">${attrs.length} attrezz.</span>
                ${currentUser.ruolo === 'admin' ? `<button class="btn-danger btn-sm" onclick="event.stopPropagation(); eliminaPersona('${u.id}')">🗑️</button>` : ''}
              </div>
            </div>
            <div class="attrezzature-container hidden" style="padding:0 1rem 1rem;">
              ${attrs.map(a => {
                const stato = getStatus(a);
                return `
                  <div class="attrezzatura-row">
                    <div><strong>${a.tipo}</strong> (Matr. ${a.matricola})<br>Rev: ${a.dataRevisione || '-'} | Scad: ${a.dataScadenza || '-'}</div>
                    <div style="display:flex; align-items:center; gap:10px;">
                      <span class="circle ${stato}"></span> ${stato === 'red' ? 'Fuori servizio' : stato === 'yellow' ? 'In scadenza' : 'OK'}
                      <button class="btn-danger btn-sm" onclick="eliminaAttrezzatura('${a.id}')">🗑️</button>
                    </div>
                  </div>
                `;
              }).join('')}
              <div style="display:flex; gap:0.5rem; flex-wrap:wrap; margin-top:0.8rem;">
                <input type="text" id="tipo-${u.id}" placeholder="Tipo" required>
                <input type="text" id="matricola-${u.id}" placeholder="Matricola" required>
                <input type="date" id="revisione-${u.id}" placeholder="Revisione">
                <input type="date" id="scadenza-${u.id}" required>
                <button class="btn btn-dark btn-sm" onclick="aggiungiAttrezzatura('${u.id}')">+ Aggiungi</button>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    window.aggiungiAttrezzatura = function(personaId) {
      if (currentUser.ruolo !== 'admin' && currentUser.id !== personaId) return alert('Non autorizzato');
      const tipo = document.getElementById(`tipo-${personaId}`).value.trim();
      const matricola = document.getElementById(`matricola-${personaId}`).value.trim();
      const scadenza = document.getElementById(`scadenza-${personaId}`).value;
      const revisione = document.getElementById(`revisione-${personaId}`).value;
      if (!tipo || !matricola || !scadenza) return alert('Compila tipo, matricola e scadenza');
      db.attrezzature.push({
        id: 'a_' + Date.now() + Math.random(),
        personaId,
        tipo,
        matricola,
        dataScadenza: scadenza,
        dataRevisione: revisione || null
      });
      document.getElementById(`tipo-${personaId}`).value = '';
      document.getElementById(`matricola-${personaId}`).value = '';
      document.getElementById(`scadenza-${personaId}`).value = '';
      document.getElementById(`revisione-${personaId}`).value = '';
      save();
      renderGestione();
      if (!tabDashboard.classList.contains('hidden')) renderDashboard();
    };

    window.eliminaAttrezzatura = function(id) {
      const attr = db.attrezzature.find(a => a.id === id);
      if (!attr || (currentUser.ruolo !== 'admin' && currentUser.id !== attr.personaId)) return alert('Non autorizzato');
      if (confirm('Eliminare questa attrezzatura?')) {
        db.attrezzature = db.attrezzature.filter(a => a.id !== id);
        save();
        renderGestione();
        if (!tabDashboard.classList.contains('hidden')) renderDashboard();
      }
    };

    window.eliminaPersona = function(id) {
      if (currentUser.ruolo !== 'admin') return;
      const user = db.utenti.find(u => u.id === id);
      if (!user) return;
      if (confirm(`Eliminare definitivamente ${user.nome} ${user.cognome} e tutte le sue attrezzature?`)) {
        db.utenti = db.utenti.filter(u => u.id !== id);
        db.attrezzature = db.attrezzature.filter(a => a.personaId !== id);
        save();
        renderGestione();
        if (!tabUtenti.classList.contains('hidden')) renderUtenti();
        if (!tabDashboard.classList.contains('hidden')) renderDashboard();
      }
    };

    function renderUtenti() {
      if (currentUser.ruolo !== 'admin') return;
      const users = db.utenti.filter(u => u.id !== 'admin');
      if (users.length === 0) {
        utentiContent.innerHTML = '<p>Nessun utente registrato.</p>';
        return;
      }
      utentiContent.innerHTML = users.map(u => `
        <div class="utente-row">
          <div>
            <strong>${u.nome} ${u.cognome}</strong> <span style="color:#64748b;">(${u.username})</span>
          </div>
          <button class="btn-danger btn-sm" onclick="eliminaPersona('${u.id}')">🗑️ Elimina</button>
        </div>
      `).join('');
    }

    function renderDashboard() {
      const problematiche = db.attrezzature.filter(a => {
        if (currentUser.ruolo !== 'admin' && a.personaId !== currentUser.id) return false;
        return ['red','yellow'].includes(getStatus(a));
      });
      if (problematiche.length === 0) {
        dashboardContent.innerHTML = '<p>✅ Nessuna attrezzatura in scadenza o fuori servizio.</p>';
        return;
      }
      dashboardContent.innerHTML = problematiche.sort((a,b) => getStatus(a) === 'red' ? -1 : 1).map(a => {
        const p = db.utenti.find(u => u.id === a.personaId) || {};
        const stato = getStatus(a);
        return `
          <div style="background:white; border-radius:8px; padding:0.8rem; margin-bottom:0.5rem; border-left:5px solid ${stato === 'red' ? '#ef4444' : '#eab308'};">
            <strong>${p.nome} ${p.cognome}</strong> – ${a.tipo} (${a.matricola})<br>
            Revisione: ${a.dataRevisione || '-'} | Scadenza: ${a.dataScadenza || '-'}
            <span style="float:right;"><span class="circle ${stato}"></span> ${stato === 'red' ? 'Fuori servizio' : 'In scadenza'}</span>
          </div>
        `;
      }).join('');
    }

    // ----- ESPORTAZIONE CSV -----
    function esportaCSV() {
      const rows = [];
      // Intestazione
      rows.push(['Nome', 'Cognome', 'Tipo', 'Matricola', 'Data Revisione', 'Data Scadenza', 'Stato'].join(','));

      const filterUser = currentUser.ruolo === 'admin' ? null : currentUser.id;
      db.attrezzature.forEach(a => {
        if (filterUser && a.personaId !== filterUser) return;
        const p = db.utenti.find(u => u.id === a.personaId) || {};
        const stato = getStatus(a);
        const statoTestuale = stato === 'red' ? 'Fuori servizio' : stato === 'yellow' ? 'In scadenza' : 'OK';
        rows.push([
          `"${p.nome || ''}"`,
          `"${p.cognome || ''}"`,
          `"${a.tipo}"`,
          `"${a.matricola}"`,
          a.dataRevisione || '',
          a.dataScadenza || '',
          statoTestuale
        ].join(','));
      });

      const csvContent = rows.join('\n');
      const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.setAttribute('href', url);
      link.setAttribute('download', 'attrezzature_nucleo.csv');
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    document.getElementById('exportCsvBtn').addEventListener('click', esportaCSV);

    document.getElementById('addPersonBtn').addEventListener('click', () => {
      if (currentUser.ruolo !== 'admin') return;
      const nome = document.getElementById('newNome').value.trim();
      const cognome = document.getElementById('newCognome').value.trim();
      const username = document.getElementById('newUsername').value.trim();
      if (!nome || !cognome || !username) return alert('Compila tutti i campi');
      if (db.utenti.find(u => u.username === username)) return alert('Username già esistente');
      const newUser = {
        id: 'u_' + Date.now() + Math.random(),
        nome,
        cognome,
        username,
        password: '',
        ruolo: 'user'
      };
      db.utenti.push(newUser);
      document.getElementById('newNome').value = '';
      document.getElementById('newCognome').value = '';
      document.getElementById('newUsername').value = '';
      save();
      renderGestione();
      if (!tabUtenti.classList.contains('hidden')) renderUtenti();
    });

    document.getElementById('checkNotificheBtn').addEventListener('click', () => {
      if (!('Notification' in window)) return alert('Notifiche non supportate');
      const msg = db.attrezzature.filter(a => {
        if (currentUser.ruolo !== 'admin' && a.personaId !== currentUser.id) return false;
        return ['red','yellow'].includes(getStatus(a));
      }).map(a => {
        const p = db.utenti.find(u => u.id === a.personaId) || {};
        return `${p.nome} ${p.cognome} - ${a.tipo} (${a.matricola}) ${getStatus(a)==='red'?'FUORI SERVIZIO':'in scadenza'}`;
      }).join('\n') || 'Nessun problema';
      if (Notification.permission === 'granted') new Notification('📋 Riepilogo', {body: msg});
      else Notification.requestPermission().then(p => { if (p === 'granted') new Notification('📋 Riepilogo', {body: msg}); else alert(msg); });
    });

    if (currentUser) showApp(); else showLogin();
  })();
</script>
</body>
</html>
